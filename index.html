  <!-- Mittelalterliche Schriftart -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

    #unity-canvas {
      display: block;

      height: 100vh;

    /* Ladeanzeige */
    #loading-cover {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }

    #loading-cover.hidden {
      display: none;
    }

    #loading-text {
      color: #ff8c00;
      font-family: 'Cinzel', Georgia, serif;

        0 0 8px rgba(255, 140, 0, 0.8),
        0 0 20px rgba(255, 100, 0, 0.5);

    @keyframes loadingGlow {
      from {
        text-shadow:
          0 0 5px rgba(255, 140, 0, 0.5),
          0 0 12px rgba(255, 100, 0, 0.3);
      }

        text-shadow:
          0 0 12px rgba(255, 140, 0, 1),

<body>

  <div id="game-container">

    <canvas id="unity-canvas"
      width="2400"
      height="1080"
      tabindex="-1">
    </canvas>

    <div id="loading-cover">
      <div id="loading-text">
        Knight Attack wird geladen
      </div>
    </div>

    <button id="fullscreen-button" type="button">
      ⛶ Vollbild
    </button>

  </div>

  <div id="rotate-message">
    <div class="rotate-icon">📱 ↻</div>
    <h2>Bitte drehe dein Gerät</h2>
    <p>Knight Attack ist für das Querformat gemacht.</p>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const gameContainer = document.querySelector("#game-container");
    const fullscreenButton = document.querySelector("#fullscreen-button");

    canvas.width = 2400;
    canvas.height = 1080;

    function resizeGame() {
      const cw = window.innerWidth;
      const ch = window.innerHeight;

      const targetRatio = 2400 / 1080;
      const availableRatio = cw / ch;

      let width, height;

      if (availableRatio > targetRatio) {
        height = ch;
        width = height * targetRatio;
      } else {
        width = cw;
        height = width / targetRatio;
      }

      canvas.style.width = Math.floor(width) + "px";
      canvas.style.height = Math.floor(height) + "px";
    }

    window.addEventListener("resize", resizeGame);
    window.addEventListener("orientationchange", resizeGame);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeGame);
    }

    resizeGame();

    /* Vollbild aktivieren */
    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          if (gameContainer.requestFullscreen) {
            await gameContainer.requestFullscreen();
          }

          /* Querformat versuchen */
          if (screen.orientation && screen.orientation.lock) {
            try {
              await screen.orientation.lock("landscape");
            } catch (e) {
              console.log("Querformatsperre nicht unterstützt.");
            }
          }
        }
      } catch (e) {
        console.log("Vollbild wird nicht unterstützt.");
      }

      resizeGame();
    });

    document.addEventListener("fullscreenchange", resizeGame);

    /* Unity laden */
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Knight Attack updates.loader.js";

    const config = {
      dataUrl: buildUrl + "/Knight Attack updates.data.unityweb",
      frameworkUrl: buildUrl + "/Knight Attack updates.framework.js.unityweb",
      codeUrl: buildUrl + "/Knight Attack updates.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ICE Labs",
      productName: "Knight Attack",
      productVersion: "0.0"
    };

    const script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, () => {})
        .then(() => {
          loadingCover.classList.add("hidden");
          resizeGame();
        })
        .catch((message) => {
          loadingCover.innerHTML =
            '<div style="color:#fff;font-family:Arial,sans-serif;text-align:center;padding:20px;">Unable to load the game.<br><br>' +
            message +
            '</div>';
        });
    };

    script.onerror = () => {
      loadingCover.innerHTML =
        '<div style="color:#ff8c00;font-family:Georgia,serif;text-align:center;padding:20px;">Knight Attack konnte nicht geladen werden.</div>';
    };

    document.body.appendChild(script);
  </script>

</body>
</html>
