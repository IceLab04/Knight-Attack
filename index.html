<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knight Attack</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #game-container { position:fixed; inset:0; width:100vw; height:100vh; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #unity-canvas { display:block; flex:none; width:100vw; height:100vh; aspect-ratio:20/9; background:#000; }
    #loading-cover { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000; z-index:10; }
    #loading-cover.hidden { display:none; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="unity-canvas" width="2400" height="1080" tabindex="-1"></canvas>
    <div id="loading-cover"><div style="color:#fff;font-family:Arial,sans-serif;font-size:18px;">Loading...</div></div>
  </div>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    canvas.width = 2400;
    canvas.height = 1080;

    function resizeGame() {
      const cw = window.innerWidth;
      const ch = window.innerHeight;
      const targetRatio = 2400 / 1080;
      const availableRatio = cw / ch;
      let width, height;
      if (availableRatio > targetRatio) {
        height = ch;
        width = height * targetRatio;
      } else {
        width = cw;
        height = width / targetRatio;
      }
      canvas.style.width = Math.floor(width) + "px";
      canvas.style.height = Math.floor(height) + "px";
    }
    window.addEventListener("resize", resizeGame);
    window.addEventListener("orientationchange", resizeGame);
    resizeGame();

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Build.loader.js";
    const config = {
      dataUrl: buildUrl + "/Build.data.unityweb",
      frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
      codeUrl: buildUrl + "/Build.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ICE Labs",
      productName: "Knight Attack",
      productVersion: "0.0"
    };

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, () => {}).then(() => {
        loadingCover.classList.add("hidden");
      }).catch((message) => {
        loadingCover.innerHTML = '<div style="color:#fff;font-family:Arial,sans-serif;text-align:center;padding:20px;">Unable to load the game.<br><br>' + message + '</div>';
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
