<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Knight Attack</title>

    <!-- Unity-Loader frühzeitig laden -->
    <link rel="preload"
          href="Build/Knight%20Attack%20updates.loader.js"
          as="script"
          fetchpriority="high">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* Ladeanzeige */
        #loading-cover {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #ff8c00;
            font-family: Georgia, serif;
            text-align: center;
        }

        #loading-cover.hidden {
            display: none;
        }

        #loading-title {
            font-size: clamp(24px, 4vw, 42px);
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 12px rgba(255, 100, 0, 0.5);
        }

        /* Dauerhaft drehender Ladekreis */
        #loading-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 140, 0, 0.2);
            border-top: 5px solid #ff8c00;
            border-right: 5px solid #ffb347;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 25px;
            will-change: transform;
        }

        /* Fortschrittsbalken */
        #progress-container {
            position: relative;
            width: min(70%, 350px);
            height: 12px;
            border: 1px solid #ff8c00;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a1a;
        }

        #progress-bar {
            position: relative;
            width: 0%;
            height: 100%;
            background: #ff8c00;
            border-radius: 10px;
            transition: width 0.15s linear;
            overflow: hidden;
        }

        /* Kleine Lichtbewegung im geladenen Bereich */
        #progress-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.55),
                transparent
            );
            animation: progress-shine 1.2s linear infinite;
        }

        #progress-text {
            margin-top: 12px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #ffb15c;
        }

        #loading-error {
            display: none;
            max-width: 85%;
            margin-top: 20px;
            color: #ff5555;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes progress-shine {
            from { left: -50%; }
            to { left: 110%; }
        }

        /* Normaler Vollbild-Button */
        #fullscreen-button {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            padding: 9px 14px;
            border: 1px solid #ff8c00;

            color: #ff8c00;

            font-size: 15px;
            cursor: pointer;
        }

        #fullscreen-button:hover {
            background: rgba(255, 140, 0, 0.2);
        }

        /* Im Vollbild den Button vollständig ausblenden */
        #game-container.fullscreen-active #fullscreen-button {

        }
    </style>
</head>

<body>

    <div id="game-container">

        <canvas id="unity-canvas"
                width="2400"
                height="1080"
                tabindex="-1">
        </canvas>

        <!-- Ladeanzeige bleibt innerhalb des Vollbildbereichs -->
        <div id="loading-cover">

            <div id="loading-title">Knight Attack is loading</div>

            <div id="loading-spinner"></div>

            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <div id="progress-text">0 %</div>

            <div id="loading-error"></div>

        </div>

        <button id="fullscreen-button">⛶ Vollbild</button>

    </div>

    <script>
        const canvas = document.querySelector("#unity-canvas");
        const gameContainer = document.querySelector("#game-container");
        const loadingCover = document.querySelector("#loading-cover");
        const loadingError = document.querySelector("#loading-error");
        const progressBar = document.querySelector("#progress-bar");
        const progressText = document.querySelector("#progress-text");
        const fullscreenButton = document.querySelector("#fullscreen-button");

        /* Seitenverhältnis 2400 x 1080 beibehalten */
        function resizeGame() {
            const targetRatio = 2400 / 1080;

            const width = gameContainer.clientWidth;
            const height = gameContainer.clientHeight;

            const windowRatio = width / height;

            if (windowRatio > targetRatio) {
                canvas.style.height = "100%";
                canvas.style.width = (height * targetRatio) + "px";
            } else {
                canvas.style.width = "100%";
                canvas.style.height = (width / targetRatio) + "px";
            }
        }

        window.addEventListener("resize", resizeGame);
        window.addEventListener("orientationchange", resizeGame);

        resizeGame();

        /* Vollbild einschalten */
        fullscreenButton.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await gameContainer.requestFullscreen();

                    if (screen.orientation && screen.orientation.lock) {
                        try {
                            await screen.orientation.lock("landscape");
                        } catch (error) {
                            // Nicht jeder Browser unterstützt die Sperre.
                        }
                    }
                }
            } catch (error) {
                console.warn("Vollbild konnte nicht aktiviert werden:", error);
            }
        });

        /* Vollbildstatus aktualisieren */
        document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement === gameContainer) {
                gameContainer.classList.add("fullscreen-active");
            } else {
                gameContainer.classList.remove("fullscreen-active");
            }

            resizeGame();
        });

        /* Unity-Build-Dateien */
        const buildUrl = "Build";

        const loaderUrl =
            buildUrl + "/Knight Attack updates.loader.js";

        const config = {
            dataUrl:
                buildUrl + "/Knight Attack updates.data.unityweb",

            frameworkUrl:
                buildUrl + "/Knight Attack updates.framework.js.unityweb",

            codeUrl:
                buildUrl + "/Knight Attack updates.wasm.unityweb",

            streamingAssetsUrl: "StreamingAssets",
            companyName: "ICE Labs",
            productName: "Knight Attack",
            productVersion: "0.0"
        };

        /* Tatsächlichen Unity-Ladefortschritt anzeigen */
        function updateProgress(progress) {
            const percent = Math.min(
                100,
                Math.max(0, Math.round(progress * 100))
            );

            progressBar.style.width = percent + "%";
            progressText.textContent = percent + " %";
        }

        /* Unity-Loader laden */
        const script = document.createElement("script");

        script.src = loaderUrl;

        script.onload = () => {

            createUnityInstance(
                canvas,
                config,
                (progress) => {
                    updateProgress(progress);
                }
            ).then((unityInstance) => {

                updateProgress(100);

                /* Erst nach vollständigem Laden ausblenden */
                loadingCover.classList.add("hidden");

                resizeGame();

            }).catch((message) => {

                loadingError.style.display = "block";
                loadingError.textContent =
                    "Loading error: " + message;

                progressText.textContent = "Loading failed";
            });
        };

        script.onerror = () => {

            loadingError.style.display = "block";

            loadingError.textContent =
                "The Unity loader could not be loaded. Please reload the page.";

            progressText.textContent = "Loading failed";
        };

        document.body.appendChild(script);
    </script>

        data-cf-beacon='{"token": "2410bef32c094aab86a8241c494b76f2"}'>
    </script>

</body>
</html>
