<!DOCTYPE html>
<html lang="de">

  <title>Knight Attack</title>

  <!-- Mittelalterliche Schrift -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #unity-canvas {
      display: block;
      flex: none;
      background: #000;
    }

    /* Ladebildschirm */
    #loading-cover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
      gap: 28px;
    }

    #loading-cover.hidden {
      display: none;
    }

    #loading-text {
      color: #ff8c00;
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(22px, 3vw, 42px);
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      padding: 15px;
      text-shadow:
        0 0 8px rgba(255, 140, 0, 0.8),
        0 0 20px rgba(255, 100, 0, 0.5);
    }

    /* Bewegender Ladekreis */
    #loading-spinner {
      width: 55px;
      height: 55px;
      border: 5px solid rgba(255, 140, 0, 0.2);
      border-top: 5px solid #ff8c00;
      border-right: 5px solid #ff8c00;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      box-shadow: 0 0 14px rgba(255, 140, 0, 0.35);
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Vollbild-Button */
    #fullscreen-button {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 30;
      padding: 12px 18px;
      color: white;
      background: rgba(25, 25, 25, 0.9);
      border: 2px solid white;
      border-radius: 8px;
      font-size: 15px;

      background: #555;

</head>

<body>

  <div id="game-container">

    <canvas
      id="unity-canvas"
      width="2400"
      height="1080"
      tabindex="-1">
    </canvas>

    <div id="loading-cover">
      <div id="loading-text">
        Knight Attack wird geladen
      </div>

      <div id="loading-spinner"></div>
    </div>

    <button id="fullscreen-button" type="button">
      ⛶ Vollbild
    </button>

  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const gameContainer = document.querySelector("#game-container");
    const fullscreenButton = document.querySelector("#fullscreen-button");

    canvas.width = 2400;
    canvas.height = 1080;

    /* Spielgröße an Bildschirm anpassen */
    function resizeGame() {
      const cw = window.innerWidth;
      const ch = window.innerHeight;

      const targetRatio = 2400 / 1080;
      const availableRatio = cw / ch;

      let width;
      let height;

      if (availableRatio > targetRatio) {
        height = ch;
        width = height * targetRatio;
      } else {
        width = cw;
        height = width / targetRatio;
      }

      canvas.style.width = Math.floor(width) + "px";
      canvas.style.height = Math.floor(height) + "px";
    }

    window.addEventListener("resize", resizeGame);
    window.addEventListener("orientationchange", resizeGame);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resizeGame);
    }

    resizeGame();

    /* Vollbild ein- und ausschalten */
    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          if (gameContainer.requestFullscreen) {
            await gameContainer.requestFullscreen();
          }

          if (screen.orientation && screen.orientation.lock) {
            try {
              await screen.orientation.lock("landscape");
            } catch (e) {
              console.log("Querformatsperre nicht unterstützt.");
            }
          }
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {
        console.log("Vollbild nicht verfügbar:", e);
      }

      resizeGame();
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent =
        document.fullscreenElement ? "⛶ Vollbild verlassen" : "⛶ Vollbild";

      resizeGame();
    });

    /* Unity Build laden */
    const buildUrl = "Build";

    const loaderUrl = buildUrl + "/Knight Attack updates.loader.js";

    const config = {
      dataUrl: buildUrl + "/Knight Attack updates.data.unityweb",
      frameworkUrl: buildUrl + "/Knight Attack updates.framework.js.unityweb",
      codeUrl: buildUrl + "/Knight Attack updates.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ICE Labs",
      productName: "Knight Attack",
      productVersion: "0.0"
    };

    const script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {

      createUnityInstance(canvas, config, (progress) => {
        // Unity lädt im Hintergrund.
      })
      .then(() => {
        loadingCover.classList.add("hidden");
        resizeGame();
      })
      .catch((message) => {
        loadingCover.innerHTML =
          '<div style="color:#ff8c00;font-family:Georgia,serif;text-align:center;padding:20px;">' +
          'Knight Attack konnte nicht geladen werden.<br><br>' +
          message +
          '</div>';
      });
    };

    script.onerror = () => {
      loadingCover.innerHTML =
        '<div style="color:#ff8c00;font-family:Georgia,serif;text-align:center;padding:20px;">' +
        'Die Unity-Ladedatei konnte nicht gefunden werden.<br>' +
        'Bitte überprüfe den Build-Ordner.' +
        '</div>';
    };

    document.body.appendChild(script);
  </script>

</body>
</html>
