        * {

        html, body {

            padding: 0;
            width: 100%;

            overflow: hidden;
            background: #000;
        }

        #game-container {
            position: fixed;

        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        /* Ladeanzeige */
        #loading-cover {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #ff8c00;
            font-family: Georgia, serif;
            text-align: center;
        }

        #loading-cover.hidden {
            display: none;
        }

        #loading-title {
            font-size: clamp(24px, 4vw, 42px);
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-shadow: 0 0 12px rgba(255, 100, 0, 0.5);
        }

        #loading-spinner {
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 140, 0, 0.2);
            border-top: 5px solid #ff8c00;
            border-right: 5px solid #ffb347;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 25px;
            will-change: transform;
        }

        #progress-container {
            position: relative;
            width: min(70%, 350px);
            height: 12px;
            border: 1px solid #ff8c00;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a1a;
        }

        #progress-bar {
            position: relative;
            width: 0%;
            height: 100%;
            background: #ff8c00;
            border-radius: 10px;
            transition: width 0.15s linear;
            overflow: hidden;
        }

        #progress-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.55),
                transparent
            );
            animation: progress-shine 1.2s linear infinite;
        }

        #progress-text {
            margin-top: 12px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #ffb15c;
        }

        #loading-error {
            display: none;
            max-width: 85%;
            margin-top: 20px;
            color: #ff5555;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes progress-shine {
            from { left: -50%; }
            to { left: 110%; }
        }

        /* Vollbild-Button */
        #fullscreen-button {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            padding: 9px 14px;
            border: 1px solid #ff8c00;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.75);
            color: #ff8c00;
            font-family: Georgia, serif;
            font-size: 15px;
            cursor: pointer;
        }

        #fullscreen-button:hover {
            background: rgba(255, 140, 0, 0.2);
        }

        /* Im Vollbild keinen Zurück-Button anzeigen */
        #game-container.fullscreen-active #fullscreen-button {
            display: none;
        }

        /* Auf iOS den Vollbild-Button vollständig entfernen */
        html.ios-device #fullscreen-button {
            display: none !important;
        }
    </style>
</head>
