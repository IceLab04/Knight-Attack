    <link rel="preload"
          href="Build/Knight%20Attack%20updates.loader.js"

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;

        #game-container {
            position: fixed;

<body>
    <div id="game-container">
        <canvas id="unity-canvas"
                width="2400"
                height="1080"
                tabindex="-1">
        </canvas>
    </div>

    <div id="loading-cover">
        <div id="loading-title">Knight Attack wird geladen</div>
        <div id="loading-spinner"></div>
        <div id="loading-error"></div>
    </div>

    <button id="fullscreen-button">⛶ Vollbild</button>

    <script>
        const canvas = document.querySelector("#unity-canvas");
        const gameContainer = document.querySelector("#game-container");
        const loadingCover = document.querySelector("#loading-cover");
        const loadingError = document.querySelector("#loading-error");
        const fullscreenButton = document.querySelector("#fullscreen-button");

        /* Das Spiel bleibt immer im Seitenverhältnis 2400 x 1080 */
        function resizeGame() {
            const targetRatio = 2400 / 1080;
            const windowRatio = window.innerWidth / window.innerHeight;

            if (windowRatio > targetRatio) {
                canvas.style.height = "100%";
                canvas.style.width = (window.innerHeight * targetRatio) + "px";
            } else {
                canvas.style.width = "100%";
                canvas.style.height = (window.innerWidth / targetRatio) + "px";
            }
        }

        window.addEventListener("resize", resizeGame);
        window.addEventListener("orientationchange", resizeGame);
        resizeGame();

        /* Vollbild ein- und ausschalten */
        fullscreenButton.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await gameContainer.requestFullscreen();

                    if (screen.orientation && screen.orientation.lock) {
                        try {
                            await screen.orientation.lock("landscape");
                        } catch (error) {
                            // Nicht jeder Browser unterstützt die Ausrichtungssperre.
                        }
                    }
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.warn("Vollbild konnte nicht geändert werden:", error);
            }
        });

        document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement) {
                fullscreenButton.textContent = "Vollbild verlassen";
                fullscreenButton.classList.add("exit-small");
            } else {
                fullscreenButton.textContent = "⛶ Vollbild";
                fullscreenButton.classList.remove("exit-small");
            }

            resizeGame();
        });

        /* Unity-Konfiguration – Build-Dateinamen unverändert */
        const buildUrl = "Build";

        const loaderUrl = buildUrl + "/Knight Attack updates.loader.js";

        const config = {
            dataUrl: buildUrl + "/Knight Attack updates.data.unityweb",
            frameworkUrl: buildUrl + "/Knight Attack updates.framework.js.unityweb",
            codeUrl: buildUrl + "/Knight Attack updates.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "ICE Labs",
            productName: "Knight Attack",
            productVersion: "0.0"
        };

        /* Unity-Loader starten */
        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(canvas, config, () => {
                // Unity lädt das Spiel.
            }).then((unityInstance) => {
                loadingCover.classList.add("hidden");
                resizeGame();
            }).catch((message) => {
                loadingError.style.display = "block";
                loadingError.textContent = "Fehler beim Laden: " + message;
            });
        };

        script.onerror = () => {
            loadingError.style.display = "block";
            loadingError.textContent =
                "Der Unity-Loader konnte nicht geladen werden. Bitte Seite neu laden.";
        };

        document.body.appendChild(script);
    </script>

    </script>
</body>
</html>
